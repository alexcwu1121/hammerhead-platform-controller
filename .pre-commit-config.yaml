repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: 'hpc/hal/.*|kicad/.*'
      - id: end-of-file-fixer
        exclude: 'hpc/hal/.*|kicad/.*'
      - id: check-yaml
        exclude: 'hpc/hal/.*|kicad/.*'
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: ["-i"]
        exclude: 'hpc/hal/.*|kicad/.*'
      #- id: clang-tidy
      #  args: ["--quiet"]
